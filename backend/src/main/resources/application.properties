# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=spice-avenue-backend

# MySQL Database Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/spice_avenue_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Spring Security & JWT Configuration
spiceavenue.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
spiceavenue.jwt.expirationMs=86400000

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Seed Data Configuration
spiceavenue.seed-data.enabled=true

# File Upload Thresholds
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
